<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamHomes | Premium Real Estate</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  color:#111;
}

/* ===== HEADER ===== */
header{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 50px;
  z-index:1000;
  border-bottom:1px solid rgba(0,0,0,0.05);
}

.logo{
  font-weight:600;
  font-size:20px;
  color:#0d1b2a;
}

nav{
  display:flex;
  align-items:center;
}

nav a{
  margin:0 18px;
  text-decoration:none;
  color:#333;
  font-size:14px;
  transition:0.3s;
}

nav a:hover{
  color:#c89b3c;
}

.header-right{
  display:flex;
  align-items:center;
  gap:20px;
}

.phone{
  font-size:14px;
  font-weight:500;
}

.cta-btn{
  background:linear-gradient(135deg,#c89b3c,#b8860b);
  color:#fff;
  padding:8px 16px;
  border-radius:6px;
  font-size:13px;
}

/* ===== HERO ===== */
.hero{
  height:100vh;
  background:
  linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),
  url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c') center/cover;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

/* CONTENT */
.hero-content{
  color:#fff;
  max-width:900px;
  animation:fadeUp 1s ease;
}

.hero h1{
  font-size:52px;
  font-weight:600;
  letter-spacing:1px;
  margin-bottom:25px;
  line-height:1.2;
}

/* ===== SEARCH ===== */
.search-container{
  display:flex;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
  margin-bottom:25px;
}

.search-container input{
  flex:1;
  padding:16px;
  border:none;
  outline:none;
  font-size:14px;
}

.search-container button{
  background:linear-gradient(135deg,#c89b3c,#b8860b);
  border:none;
  padding:0 25px;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

/* ===== CITY BOX ===== */
.city-box{
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap;
  background:rgba(255,255,255,0.08);
  padding:18px;
  border-radius:14px;
  backdrop-filter:blur(15px);
}

.city{
  background:#fff;
  padding:15px 22px;
  border-radius:10px;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.city:hover{
  transform:translateY(-5px);
  background:#c89b3c;
  color:#fff;
}

/* ===== ANIMATION ===== */
@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(40px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ===== MOBILE ===== */
@media(max-width:768px){
  header{
    padding:15px 20px;
  }

  nav{
    display:none;
  }

  .hero h1{
    font-size:30px;
  }

  .search-container input{
    padding:12px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo">DreamHomes</div>

  <nav>
    <a href="#">Home</a>
    <a href="#">Contact</a>
    <a href="#">About</a>
    <a href="#">FAQ</a>
  </nav>

  <div class="header-right">
    <span class="phone">📞 9477469499</span>
    <a href="#" class="cta-btn">Get Deals</a>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">

    <h1>Find Your Dream Property</h1>

    <div class="search-container">
      <input type="text" placeholder="Enter Location, Project or Developer">
      <button onclick="quickWhatsApp()">🔍</button>
    </div>

    <div class="city-box">
      <div class="city">Kolkata</div>
      <div class="city">Pune</div>
      <div class="city">Siliguri</div>
      <div class="city">Mumbai</div>
      <div class="city">Dubai</div>
    </div>

  </div>
</section>

<script>
function quickWhatsApp(){
  window.open("https://wa.me/919477469499?text=Hi, I am looking for property",'_blank');
}
</script>

</body>
</html>
