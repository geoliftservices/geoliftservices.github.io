<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Real Estate</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

/* ===== HEADER ===== */
header{
  position:fixed;
  top:0;
  width:100%;
  background:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 40px;
  z-index:1000;
}

.logo{
  font-weight:600;
  font-size:18px;
}

nav a{
  margin:0 15px;
  text-decoration:none;
  color:#333;
  font-size:14px;
}

.offer{
  color:#c89b3c;
  font-weight:500;
}

.right{
  display:flex;
  align-items:center;
  gap:20px;
  font-size:14px;
}

/* ===== HERO ===== */
.hero{
  height:100vh;
  background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
  url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c') center/cover;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
}

/* CONTENT */
.hero-content{
  color:#fff;
  width:100%;
  max-width:1100px;
}

.hero h1{
  font-size:42px;
  font-weight:500;
  margin-bottom:25px;
}

/* ===== SEARCH ===== */
.search-box{
  display:flex;
  width:100%;
  background:#fff;
  border-radius:6px;
  overflow:hidden;
}

.search-box input{
  flex:1;
  padding:16px;
  border:none;
  outline:none;
  font-size:14px;
}

.search-box button{
  width:70px;
  background:#c89b3c;
  border:none;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

/* ===== CITY CONTAINER ===== */
.city-wrapper{
  margin-top:30px;
  background:rgba(0,0,0,0.5);
  padding:20px;
  border-radius:12px;
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}

/* CITY CARD */
.city{
  background:#fff;
  border-radius:10px;
  padding:15px;
  width:140px;
  text-align:center;
  transition:0.3s;
  border:2px solid #eee;
}

.city img{
  width:60px;
  margin-bottom:10px;
}

.city p{
  font-size:13px;
  font-weight:500;
}

/* HOVER */
.city:hover{
  border-color:#c89b3c;
  transform:translateY(-5px);
}

/* MOBILE */
@media(max-width:768px){
  nav{display:none;}
  .hero h1{font-size:26px;}
  .search-box input{padding:12px;}
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo">DreamHomes</div>

  <nav>
    <a href="#">Home</a>
    <a href="#">Contact Us</a>
    <a href="#">About Us</a>
    <a href="#">FAQ</a>
    <a href="#" class="offer">🎁 Offers</a>
  </nav>

  <div class="right">
    <span>📞 +91 9477469499</span>
    <span>☰</span>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">

    <h1>Find Your Dream Property</h1>

    <!-- SEARCH -->
    <div class="search-box">
      <input type="text" placeholder="Enter Location, Project or Developer">
      <button onclick="quickWhatsApp()">🔍</button>
    </div>

    <!-- CITY -->
    <div class="city-wrapper">

      <div class="city">
        <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png">
        <p>Kolkata</p>
      </div>

      <div class="city">
        <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png">
        <p>Pune</p>
      </div>

      <div class="city">
        <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png">
        <p>Siliguri</p>
      </div>

      <div class="city">
        <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png">
        <p>Mumbai</p>
      </div>

      <div class="city">
        <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png">
        <p>Dubai</p>
      </div>

    </div>

  </div>
</section>

<script>
function quickWhatsApp(){
  window.open("https://wa.me/919477469499?text=Hi, I am looking for property",'_blank');
}
</script>

</body>
</html>
